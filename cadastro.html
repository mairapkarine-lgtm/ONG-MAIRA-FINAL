<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Voluntário - ONG MÁIRA</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="javascript.js" defer></script>

</head>

<body class="pagina-cadastro">


    <header aria-labelledby="titulo-cadastro">

        <img
            src="logodaongmaira.png"
            width="150"
            height="150"
            alt="Imagem representativa da ONG MÁIRA"
        >

        <div>

            <h1 id="titulo-cadastro">ONG MÁIRA</h1>

            <h2>Cadastro de Voluntário</h2>

        </div>

        <p>
            <span id="descricao-cadastro">Faça seu cadastro para participar das ações e projetos
            da ONG MÁIRA.</span>
        </p>

    </header>


    <main id="conteudo-principal" tabindex="-1">

        <form id="form-cadastro" action="#" method="post" aria-describedby="descricao-cadastro">


            <!-- DADOS PESSOAIS -->

            <fieldset>

                <legend>Dados pessoais</legend>


                <label for="nome">
                    Nome completo:
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    pattern="[A-Za-zÀ-ÿ ]+"
                    required
                >


                <label for="cpf">
                    CPF:
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                    title="Digite o CPF no formato 000.000.000-00"
                    required
                >


                <label for="email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$"
                    title="Digite o seu email no formato seuemail@exemplo.com"
                    required
                >


                <label for="nascimento">
                    Data de nascimento:
                </label>

                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required
                >


                <label for="telefone">
                    Telefone:
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                    title="Digite o telefone no formato (00) 00000-0000"
                    required
                >

            </fieldset>


            <!-- ENDEREÇO -->

            <fieldset>

                <legend>Endereço</legend>


                <label for="endereco">
                    Endereço:
                </label>

                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    placeholder="Rua, avenida, número..."
                    required
                >


                <label for="numero">
                    Número:
                </label>

                <input
                    type="number"
                    id="numero"
                    name="numero"
                    min="1"
                    max="99999"
                    required
                >


                <label for="cidade">
                    Cidade:
                </label>

                <input
                    type="text"
                    id="cidade"
                    name="cidade"
                    required
                >


                <label for="estado">
                    Estado:
                </label>

                <select
                    id="estado"
                    name="estado"
                    required
                >

                    <option value="">
                        Selecione seu estado
                    </option>

                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>

                </select>


                <label for="cep">
                    CEP:
                </label>

                <input
                    type="text"
                    id="cep"
                    name="cep"
                    placeholder="00000-000"
                    pattern="[0-9]{5}-[0-9]{3}"
                    title="Digite o CEP no formato 00000-000"
                    required
                >

            </fieldset>


            <!-- PARTICIPAÇÃO -->

            <fieldset>

                <legend>Como deseja participar?</legend>

                <p>
                    Escolha uma área de atuação:
                </p>


                <div>

                    <input
                        type="radio"
                        id="acoes"
                        name="atuacao"
                        value="acoes-sociais"
                        required
                    >

                    <label for="acoes">
                        Participar das ações sociais
                    </label>

                </div>


                <div>

                    <input
                        type="radio"
                        id="projetos"
                        name="atuacao"
                        value="projetos"
                    >

                    <label for="projetos">
                        Auxiliar nos projetos
                    </label>

                </div>


                <div>

                    <input
                        type="radio"
                        id="campanhas"
                        name="atuacao"
                        value="campanhas"
                    >

                    <label for="campanhas">
                        Divulgar campanhas
                    </label>

                </div>


                <label for="experiencia">
                    Conte um pouco sobre você:
                </label>

                <textarea
                    id="experiencia"
                    name="experiencia"
                    rows="5"
                    placeholder="Escreva aqui..."
                ></textarea>

            </fieldset>


            <!-- DISPONIBILIDADE -->

            <fieldset>

                <legend>Disponibilidade</legend>

                <label for="disponibilidade">
                    Quantas horas por semana você pode colaborar conosco?
                </label>

                <select
                    id="disponibilidade"
                    name="disponibilidade"
                    required
                >

                    <option value="">
                        Selecione
                    </option>

                    <option value="1-2">
                        1 a 2 horas
                    </option>

                    <option value="3-5">
                        3 a 5 horas
                    </option>

                    <option value="6-10">
                        6 a 10 horas
                    </option>

                    <option value="mais-10">
                        Mais de 10 horas
                    </option>

                </select>

            </fieldset>


            <!-- CONFIRMAÇÃO -->

            <fieldset>

                <legend>Confirmação</legend>

                <div>

                    <input
                        type="checkbox"
                        id="termos"
                        name="termos"
                        required
                    >

                    <label for="termos">
                        Confirmo que as informações fornecidas são verdadeiras
                        e desejo me cadastrar como voluntário da ONG MÁIRA.
                    </label>

                </div>

            </fieldset>


            <!-- BOTÕES -->

            <div class="form-botoes">

                <button type="submit">
                    Enviar cadastro
                </button>

                <button type="reset">
                    Limpar formulário
                </button>

            </div>


        </form>

    </main>


    <footer>

        <p>
            ONG MÁIRA - Organização Não Governamental de Máiras
        </p>

    </footer>


</body>
</html>
